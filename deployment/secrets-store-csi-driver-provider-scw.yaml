---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-store-csi-driver-provider-scw
  namespace: kube-system
  labels:
    app.kubernetes.io/name: secrets-store-csi-driver-provider-scw
    app.kubernetes.io/component: provider
    app.kubernetes.io/part-of: secrets-store-csi-driver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-store-csi-driver-provider-scw
  labels:
    app.kubernetes.io/name: secrets-store-csi-driver-provider-scw
    app.kubernetes.io/component: provider
    app.kubernetes.io/part-of: secrets-store-csi-driver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-store-csi-driver-provider-scw
  labels:
    app.kubernetes.io/name: secrets-store-csi-driver-provider-scw
    app.kubernetes.io/component: provider
    app.kubernetes.io/part-of: secrets-store-csi-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-store-csi-driver-provider-scw
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver-provider-scw
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: secrets-store-csi-driver-provider-scw
  namespace: kube-system
  labels:
    app.kubernetes.io/name: secrets-store-csi-driver-provider-scw
    app.kubernetes.io/component: provider
    app.kubernetes.io/part-of: secrets-store-csi-driver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: secrets-store-csi-driver-provider-scw
      app.kubernetes.io/component: provider
      app.kubernetes.io/part-of: secrets-store-csi-driver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-store-csi-driver-provider-scw
        app.kubernetes.io/component: provider
        app.kubernetes.io/part-of: secrets-store-csi-driver
    spec:
      serviceAccountName: secrets-store-csi-driver-provider-scw
      containers:
        - name: secrets-store-csi-driver-provider-scw
          image: scaleway/scaleway-secrets-store-csi:0.1.0
          ports:
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: provider-socket
              mountPath: /etc/kubernetes/secrets-store-csi-providers
          livenessProbe:
            httpGet:
              path: /health
              port: health
          readinessProbe:
            httpGet:
              path: /health
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 50m
              memory: 100Mi
      volumes:
        - name: provider-socket
          hostPath:
            path: /etc/kubernetes/secrets-store-csi-providers
      nodeSelector:
        kubernetes.io/os: linux
